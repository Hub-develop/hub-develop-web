    <title>Hub-develop</title>
    <!-- 关键内联样式：加载 CSS/字体前就锁深色底，避免白底闪烁；内容先隐藏，字体就绪后由 main.ts 淡入 -->
    <style>
      html, body { margin: 0; background: #0a0b10; color: #f4f5f8; }
      #app { opacity: 0; transition: opacity 0.45s ease; }
      #app.ready { opacity: 1; }
    </style>
    <!-- GitHub Pages SPA 回退：把 404.html 存下的深链接还原回来 -->
    <script>
      ;(function () {
        var redirect = sessionStorage.getItem('redirect')
        if (redirect) {
          sessionStorage.removeItem('redirect')
          if (redirect !== location.href) {
            history.replaceState(null, null, redirect)
          }
        }
      })()
    </script>
    <script type="module" crossorigin src="/assets/index-s1Zi27aw.js"></script>
